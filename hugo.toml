baseURL = 'https://vinayketkar.github.io/'
title = 'Vinay Ketkar'
theme = 'PaperMod'
paginate = 10
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
enableRobotsTXT = true

[params]
  env = "production"
  description = "Personal website of Vinay Ketkar — retired mechanical engineer, traveller, photographer, and storyteller."
  author = "Vinay Ketkar"
  defaultTheme = "dark"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  ShowToc = false
  images = ["images/cover.jpg"]

  [params.profileMode]
    enabled = true
    title = "Namaste! I'm Vinay Ketkar"
    subtitle = "Retired mechanical engineer from Ujjain, India  •  Traveller  •  Photographer  •  Storyteller  •  Gardener"
    imageUrl = "/images/profile.svg"
    imageWidth = 180
    imageHeight = 180
    imageTitle = "Vinay Ketkar"

    [[params.profileMode.buttons]]
      name = "📖 Blog"
      url = "/blog/"
    [[params.profileMode.buttons]]
      name = "✈️ Travel"
      url = "/travel/"
    [[params.profileMode.buttons]]
      name = "🎨 Creative"
      url = "/creative/"
    [[params.profileMode.buttons]]
      name = "👤 About Me"
      url = "/about/"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/vinayketkar"

  [params.assets]
    favicon = "/favicon.ico"
    disableFingerprinting = true

  [params.label]
    text = "विनय केतकर • Vinay Ketkar"

  [params.cover]
    hiddenInList = false
    hiddenInSingle = false

