baseURL = 'https://vinayketkar.github.io/'
title = 'Vinay Ketkar'
theme = 'PaperMod'
paginate = 10
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
enableRobotsTXT = true

[params]
  env = "production"
  description = "Personal website of Vinay Ketkar — retired mechanical engineer, traveller, photographer, and storyteller."
  author = "Vinay Ketkar"
  defaultTheme = "dark"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = false
  images = ["images/cover.jpg"]

  [params.homeInfoParams]
    Title = "Namaste! I'm Vinay Ketkar"
    Content = """
A retired mechanical engineer from Ujjain, India, with nearly three decades of experience \
at Larsen & Toubro. Now I spend my time exploring the world, \
capturing moments through photography, tending my garden, and sharing stories \
about books, travel, and life's interesting discoveries.

Welcome to my corner of the internet.
"""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/vinayketkar"

  [params.assets]
    favicon = "/favicon.ico"
    disableFingerprinting = true

  [params.label]
    text = "Vinay Ketkar"

