# ── Taxonomies ───────────────────────────────────────────────────────────────

[taxonomies]
  tag = "tags"
  category = "categories"

# ── Markup ───────────────────────────────────────────────────────────────────

[markup]
  [markup.highlight]
    style = "monokai"
  [markup.goldmark.renderer]
    unsafe = true

# ── Outputs ──────────────────────────────────────────────────────────────────

[outputs]
  home = ["HTML", "RSS", "JSON"]
